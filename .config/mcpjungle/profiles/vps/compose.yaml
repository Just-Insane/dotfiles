name: mcp-platform

services:
  db:
    image: postgres:17-alpine
    container_name: mcp-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcpjungle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mcpjungle
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpjungle -d mcpjungle"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:0.4.5
    container_name: mcp-platform-mcpjungle
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mcpjungle:${POSTGRES_PASSWORD}@db:5432/mcpjungle
      SERVER_MODE: enterprise
      OTEL_ENABLED: "true"
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: "60"
    networks: [backend, edge]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mcp-platform-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    depends_on: [mcpjungle]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  catalog-mcp:
    build:
      context: ./catalog
    container_name: mcp-platform-catalog
    restart: unless-stopped
    environment:
      CATALOG_CONTENT_ROOT: /catalog/content
      CATALOG_BEARER_TOKEN: ${CATALOG_BEARER_TOKEN}
      CATALOG_CLOUDFLARE_BEARER_TOKEN: ${CATALOG_CLOUDFLARE_BEARER_TOKEN:-}
      CATALOG_MAX_AGE_HOURS: "48"
      FASTMCP_DOCKET_URL: memory://
    volumes:
      - ./catalog/content:/catalog/content:ro
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: mcp-platform-cloudflared
    restart: unless-stopped
    networks: [edge]
    extra_hosts: [host.docker.internal:host-gateway]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflared-token]
    volumes:
      - ./secrets/cloudflared-token:/run/secrets/cloudflared-token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend:
    name: mcp-platform-backend
    internal: true
  edge:
    name: mcp-platform-edge

volumes:
  db-data: {name: mcp-platform-db-data}
  prometheus-data: {name: mcp-platform-prometheus-data}
