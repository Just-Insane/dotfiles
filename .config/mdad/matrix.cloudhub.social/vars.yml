    setup:
      root:
        level: "INFO"

# You need at least 1 app defined.
# The configuration below is incomplete. Read more below.

matrix_sygnal_apps:
  social.cloudhub.sable.web:
    type: webpush
    vapid_private_key: "/data/sygnal_private_key.pem"
    vapid_contact_email: "admin@cloudhub.social"
  # Enable after manually creating the Apple Developer APNs key for
  # the charm.cloudhub.social App ID.
  # sygnal.cloudhub.social:
  #   type: apns
  #   keyfile: "/data/sygnal.cloudhub.social.apns.p8"
  #   key_id: "APPLE_APNS_KEY_ID"
  #   team_id: "APPLE_TEAM_ID"
  #   topic: "charm.cloudhub.social"
  #   platform: sandbox
  social.cloudhub.charm.web:
    type: webpush
    vapid_private_key: "/data/sygnal_private_key.pem"
    vapid_contact_email: "admin@cloudhub.social"
  # Enable after manually creating the Apple Developer APNs key for
  # the charm.cloudhub.social App ID.
  # sygnal.cloudhub.social:
  #   type: apns
  #   keyfile: "/data/sygnal.cloudhub.social.apns.p8"
  #   key_id: "APPLE_APNS_KEY_ID"
  #   team_id: "APPLE_TEAM_ID"
  #   topic: "charm.cloudhub.social"
  #   platform: sandbox

  # UnifiedPush (Android external distributor) does NOT need a Sygnal app entry.
  # There is no `http` pushkin type in Sygnal v0.15.1 (only apns/gcm/webpush exist —
  # adding `type: http` crashes the service with "No module named 'sygnal.httppushkin'").
  # The UnifiedPush distributor URL the client registers with Synapse's `set_pusher`
  # (kind: "http") *is* the push gateway per the Matrix Push Gateway API spec —
  # Synapse posts to it directly, bypassing Sygnal entirely.

  social.cloudhub.charm.android:
    type: gcm
    api_version: v1
    project_id: sygnal-matrix
    service_account_file: /data/sygnal-matrix-f2f19c01577b.json

  # APNs placeholder for Charm 2.0 iOS — uncomment and fill in when Apple Developer
  # account has provisioned the cert/key. Steps:
  #   1. Create an APNs Auth Key (.p8) in Apple Developer Portal for the Charm App ID
  #   2. Add an aux_file_definitions entry to install the .p8 at matrix_sygnal_data_path
  #   3. Uncomment this block and fill in key_id, team_id, topic
  # social.cloudhub.charm.ios:
  #   type: apns
  #   keyfile: "/data/charm.cloudhub.social.apns.p8"
  #   key_id: REPLACE_WITH_APPLE_KEY_ID
  #   team_id: REPLACE_WITH_APPLE_TEAM_ID
  #   topic: social.cloudhub.charm
  #   platform: sandbox   # change to production when going live

# CrowdSec's official repository is installed on the host. Keep the detection
# engine and nftables remediation component part of the playbook-managed package set.
aux_package_definitions_custom:
  - crowdsec
  - crowdsec-firewall-bouncer-nftables

aux_file_definitions:
  - dest: "{{ matrix_sygnal_data_path }}/sygnal_private_key.pem"
    content: "{{ lookup('ansible.builtin.env', 'MDAD_SYGNAL_VAPID_PRIVATE_PEM', default=undef()) }}"
    mode: "0600"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"

  # Firebase Admin SDK service-account credentials for social.cloudhub.charm.android's
  # FCM v1 pushkin.
  - dest: "{{ matrix_sygnal_data_path }}/sygnal-matrix-f2f19c01577b.json"
    content: "{{ lookup('ansible.builtin.env', 'MDAD_FIREBASE_SERVICE_ACCOUNT_JSON', default=undef()) }}"
    mode: "0600"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"

  # Enable after manually creating and downloading the Apple Developer APNs
  # .p8 key. Keep the in-container path in matrix_sygnal_apps as /data/...
  # - dest: "{{ matrix_sygnal_data_path }}/sygnal.cloudhub.social.apns.p8"
  #   content: |
  #     -----BEGIN PRIVATE KEY-----
  #     PASTE_APNS_P8_CONTENT_HERE
  #     -----END PRIVATE KEY-----
  #   mode: "0600"
  #   owner: "{{ matrix_user_name }}"
  #   group: "{{ matrix_group_name }}"

  # Keep old deployment images from accumulating indefinitely. This intentionally
  # prunes images only; volumes and stopped containers are left untouched.
  - dest: /etc/systemd/system/matrix-docker-image-prune.service
    content: |
      [Unit]
      Description=Prune unused Matrix Docker images older than seven days
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --all --force --filter until=168h
      Nice=10
      IOSchedulingClass=idle

  - dest: /etc/systemd/system/matrix-docker-image-prune.timer
    content: |
      [Unit]
      Description=Weekly Matrix Docker image pruning

      [Timer]
      OnCalendar=Sun *-*-* 04:30:00
      RandomizedDelaySec=2h
      Persistent=true

      [Install]
      WantedBy=timers.target

devture_systemd_service_manager_services_list_additional:
  - name: matrix-docker-image-prune.timer
    priority: 9000
    groups: ['maintenance']

