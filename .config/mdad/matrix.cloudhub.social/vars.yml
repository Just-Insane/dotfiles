---
# The bare domain name which represents your Matrix identity.
# Matrix user IDs for your server will be of the form (`@alice:example.com`).
#
# Note: this playbook does not touch the server referenced here.
# Installation happens on another server ("matrix.example.com", see `matrix_server_fqn_matrix`).
#
# If you've deployed using the wrong domain, you'll have to run the Uninstalling step,
# because you can't change the Domain after deployment.
matrix_domain: cloudhub.social

# The Matrix homeserver software to install.
# See:
#  - `roles/custom/matrix-base/defaults/main.yml` for valid options
#  - the `docs/configuring-playbook-IMPLEMENTATION_NAME.md` documentation page, if one is available for your implementation choice
#
# By default, we use Synapse, because it's the only full-featured Matrix server at the moment.
#
# Note that the homeserver implementation of a server will not be able to be changed without data loss.
matrix_homeserver_implementation: synapse

# A secret used as a base, for generating various other secrets.
# You can put any string here, but generating a strong one is preferred. You can create one with a command like `pwgen -s 64 1`.
matrix_homeserver_generic_secret_key: "{{ lookup('ansible.builtin.env', 'MDAD_MATRIX_HOMESERVER_GENERIC_SECRET_KEY', default=undef()) }}"

# By default, the playbook manages its own Traefik (https://doc.traefik.io/traefik/) reverse-proxy server.
# It will retrieve SSL certificates for you on-demand and forward requests to all other components.
# For alternatives, see `docs/configuring-playbook-own-webserver.md`.
matrix_playbook_reverse_proxy_type: playbook-managed-traefik

# Controls whether container networks will be created with IPv6 support.
#
# If you also have IPv6 support on your server/network and AAAA DNS records pointing to the server,
# enabling this will effectively give you full public IPv6 connectivity (powered by NAT66).
#
# We recommend leaving this enabled even if you don't currently have IPv6 connectivity on your server/network.
# This way, once you eventually get IPv6 connectivity, you won't have to change anything (besides DNS records).
#
# Flipping this setting later on requires manual work (stopping services, deleting and recreating all container networks).
#
# In the future, this setting will likely default to `true`, so if you really want IPv6 disabled, explicitly set this to `false`.
#
# People managing Docker themselves and running an older Docker version will need additional configuration.
#
# Learn more in `docs/configuring-ipv6.md`.
devture_systemd_docker_base_ipv6_enabled: true
devture_systemd_service_manager_up_verification_delay_seconds: 300
devture_systemd_service_manager_service_restart_mode: clean-stop-start
matrix_playbook_migration_validated_version: v2026.05.19.0

# A Postgres password to use for the superuser Postgres user (called `matrix` by default).
#
# The playbook creates additional Postgres users and databases (one for each enabled service) using this superuser account.
#
# Changing this value subsequently requires manual work.
# The value used here must be shorter than 100 characters.
postgres_connection_password: "{{ lookup('ansible.builtin.env', 'MDAD_POSTGRES_CONNECTION_PASSWORD', default=undef()) }}"
postgres_backup_enabled: true
# enable unix sockets
postgres_container_unix_socket_enabled: true
postgres_cli_use_unix_socket_enabled: true

# By default, we configure coturn's external IP address using the value specified for `ansible_host` in your `inventory/hosts` file.
# If this value is an external IP address, you can skip this section.
#
# If `ansible_host` is not the server's external IP address, you have 2 choices:
# 1. Uncomment the line below, to allow IP address auto-detection to happen (more on this below)
# 2. Uncomment and adjust the line below to specify an IP address manually
#
# By default, auto-detection will be attempted using the `https://ifconfig.co/json` API.
# Default values for this are specified in `matrix_coturn_turn_external_ip_address_auto_detection_*` variables in the coturn role
# (see `roles/custom/matrix-coturn/defaults/main.yml`).
#
# If your server has multiple IP addresses, you may define them in another variable which allows a list of addresses.
# Example: `matrix_coturn_turn_external_ip_addresses: ['1.2.3.4', '4.5.6.7']`
#
# matrix_coturn_turn_external_ip_address: ''

## Custom config ##

matrix_static_files_container_labels_base_domain_enabled: true
matrix_admin: "@evie:{{ matrix_domain }}"
exim_relay_hostname: "mail.{{ matrix_domain }}"

# Synapse
matrix_synapse_workers_enabled: false
matrix_synapse_workers_preset: specialized-workers
# 3. Increase Synapse cache if RAM allows.
# Default has historically been around 0.5; try 1.0–2.0.
matrix_synapse_caches_global_factor: 1.2
matrix_synapse_sentry_dsn: "https://e0ef2e378acddb3986ae6fccc3ae8cc1@o4511094843244544.ingest.de.sentry.io/4511094865657936"
matrix_synapse_presence_enabled: true
matrix_synapse_auto_compressor_enabled: true
matrix_synapse_auto_accept_invites_enabled: true
matrix_synapse_auto_accept_invites_only_for_direct_messages: false
matrix_synapse_user_directory_search_all_users: true
matrix_synapse_user_directory_prefer_local_users: true
matrix_synapse_push_include_content: false

# Federation via Cloudflare proxy
matrix_synapse_http_listener_resource_names: ["client", "federation"]
matrix_federation_public_port: 443
matrix_synapse_federation_port_enabled: false
matrix_synapse_tls_federation_listener_enabled: false

# use unix sockets for Redis
matrix_synapse_redis_path_enabled: "{{ valkey_enabled }}"
# use unix sockets for Postgres
matrix_synapse_database_socket_enabled: "{{ matrix_synapse_database_host == postgres_connection_hostname }}"

# Controls whether to enable the "Delayed Events" experimental feature.
# Delayed events are required for proper call (Element Call) participation signalling.
# If disabled it is very likely that you end up with stuck calls in Matrix rooms.
#
# Related to:
# - `matrix_synapse_max_event_delay_duration`
# - `matrix_synapse_rc_delayed_event_mgmt`
#
# See https://github.com/matrix-org/matrix-spec-proposals/pull/4140
matrix_synapse_experimental_features_msc4140_enabled: true

# Controls the maximum allowed duration by which sent events can be delayed, as per MSC4140.
#
# See `matrix_synapse_experimental_features_msc4140_enabled`.
matrix_synapse_max_event_delay_duration: 730h

# Controls whether to enable the MSC4143 experimental feature (RTC transports).
#
# This is used by MatrixRTC clients to discover the unstable RTC transports API.
#
# See https://github.com/matrix-org/matrix-spec-proposals/pull/4143
matrix_synapse_experimental_features_msc4143_enabled: true

# Controls whether to enable the MSC4222 experimental feature (adding `state_after` to sync v2).
#
# Allow clients to opt-in to a change of the sync v2 API that allows them to correctly track the state of the room.
# This is required by Element Call to track room state reliably.
#
# See https://github.com/matrix-org/matrix-spec-proposals/pull/4222
matrix_synapse_experimental_features_msc4222_enabled: true

# Controls whether to enable the MSC4306 experimental feature ("thread subscriptions").
#
# In current Synapse, this also enables the MSC4308 thread-subscriptions extension
# to Sliding Sync under the same upstream feature flag.
#
# See:
# - https://github.com/matrix-org/matrix-spec-proposals/pull/4306
# - https://github.com/matrix-org/matrix-spec-proposals/pull/4308
matrix_synapse_experimental_features_msc4306_enabled: true

# Controls whether to enable the MSC4354 experimental feature (sticky events).
#
# This is implemented since Synapse v1.148.0 and can be used by element-call v0.17.0+
#
# See https://github.com/matrix-org/matrix-spec-proposals/pull/4354
matrix_synapse_experimental_features_msc4354_enabled: false

# matrix_synapse_enable_registration: true
# matrix_synapse_registration_requires_token: true
# matrix_synapse_enable_registration_captcha: true
# matrix_synapse_recaptcha_public_key: "6Lfbp2ssAAAAAMy30i_aL9qhtCmUj6aUTLpVQiLM"
# matrix_synapse_recaptcha_private_key: "REMOVED_BY_INCIDENT_RESPONSE"

matrix_synapse_trusted_key_servers:
  - server_name: "matrix.org"
  - server_name: "matrixrooms.info"

matrix_synapse_server_notices_enabled: true
matrix_synapse_server_notices_auto_join: true

# Synapse Admin
matrix_ketesa_enabled: true
matrix_ketesa_hostname: admin.cloudhub.social
matrix_ketesa_path_prefix: /

# MAS Config
matrix_authentication_service_enabled: true

# Generate this encryption secret with: `openssl rand -hex 32`
matrix_authentication_service_config_secrets_encryption: "{{ lookup('ansible.builtin.env', 'MDAD_MATRIX_AUTHENTICATION_SERVICE_CONFIG_SECRETS_ENCRYPTION', default=undef()) }}"

# Controls the `database.host` configuration setting.
#matrix_authentication_service_config_database_host: "{{ matrix_synapse_database_host == postgres_connection_hostname }}"

# Element Admin
matrix_element_admin_enabled: true
matrix_element_admin_hostname: element-admin.cloudhub.social

# Stats (Prometheus, Grafana)
prometheus_enabled: true
prometheus_node_exporter_enabled: true
prometheus_postgres_exporter_enabled: true
# Revision 8 is the current published PostgreSQL dashboard. The role default
# still points at the older revision 7 endpoint.
prometheus_postgres_exporter_dashboard_urls:
  - "https://grafana.com/api/dashboards/9628/revisions/8/download"
prometheus_nginxlog_exporter_enabled: true
grafana_enabled: true

# Grafana's unified alerting stack includes an Alertmanager. Give the existing
# Prometheus datasource a stable UID so provisioned alert rules can reference it.
grafana_provisioning_datasources_datasources:
  - name: "{{ matrix_server_fqn_matrix }} - Prometheus"
    uid: matrix-prometheus
    type: prometheus
    access: proxy
    url: "http://{{ prometheus_identifier }}:9090"
    jsonData:
      timeInterval: "{{ prometheus_config_global_scrape_interval }}"

# Remove the pre-existing copy which Grafana had assigned a generated UID.
grafana_provisioning_datasources_deleteDatasources:
  - name: "{{ matrix_server_fqn_matrix }} - Prometheus"
    orgId: 1

grafana_provisioning_contact_points_contactPoints:
  - orgId: 1
    name: matrix-infrastructure
    receivers:
      - uid: matrix-infrastructure-discord
        type: discord
        settings:
          url: "https://discord.com/api/webhooks/1526684666721996981/d9OjxeInlXJlbWtySXlkxkw6OadAH2LTzXAOS0JHUqA2msQ5tOnD8waHZwk5IvUTS6YE"
        disableResolveMessage: false

grafana_provisioning_notification_policies_policies:
  - orgId: 1
    receiver: matrix-infrastructure
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

grafana_provisioning_alerts_groups:
  - orgId: 1
    name: matrix-infrastructure
    folder: Matrix Infrastructure
    interval: 1m
    rules:
      - uid: matrix-target-down
        title: Matrix monitoring target down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: matrix-prometheus
            model:
              datasource: {type: prometheus, uid: matrix-prometheus}
              editorMode: code
              expr: min(up)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: One or more Matrix Prometheus scrape targets are unavailable
        labels:
          severity: critical
        isPaused: false

      - uid: matrix-root-disk-low
        title: Matrix root disk space low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: matrix-prometheus
            model:
              datasource: {type: prometheus, uid: matrix-prometheus}
              editorMode: code
              expr: '100 * node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}'
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [15], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Matrix root filesystem has less than 15 percent free space
        labels:
          severity: warning
        isPaused: false

      - uid: matrix-memory-low
        title: Matrix available memory low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: matrix-prometheus
            model:
              datasource: {type: prometheus, uid: matrix-prometheus}
              editorMode: code
              expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [10], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Matrix host has less than 10 percent available memory
        labels:
          severity: warning
        isPaused: false

grafana_default_admin_user: "admin"
grafana_default_admin_password: "{{ lookup('ansible.builtin.env', 'MDAD_GRAFANA_DEFAULT_ADMIN_PASSWORD', default=undef()) }}"

# Stats (Synapse)
matrix_synapse_usage_exporter_enabled: true

# Traefik
traefik_dashboard_enabled: true
traefik_dashboard_hostname: "traefik.{{ matrix_domain }}"
traefik_dashboard_basicauth_enabled: true
traefik_dashboard_basicauth_user: admin
traefik_dashboard_basicauth_password: "{{ lookup('ansible.builtin.env', 'MDAD_TRAEFIK_DASHBOARD_BASICAUTH_PASSWORD', default=undef()) }}"
traefik_config_certificatesResolvers_acme_dnsChallenge_enabled: true
traefik_config_certificatesResolvers_acme_dnsChallenge_provider: "cloudflare"
traefik_config_certificatesResolvers_acme_dnsChallenge_propagation_delayBeforeChecks: 60
traefik_config_certificatesResolvers_acme_dnsChallenge_resolvers:
  - "1.1.1.1:53"
# Set real Cloudflare API tokens before using DNS-01 ACME for Traefik.
traefik_environment_variables: |
  CF_DNS_API_TOKEN={{ lookup('ansible.builtin.env', 'MDAD_CF_DNS_API_TOKEN', default=undef()) }}
  LEGO_DISABLE_CNAME_SUPPORT=true

# 1. Make sure Traefik compression is on.
# Traefik v3 supports gzip/br/zstd via compress middleware.
traefik_config_http_middlewares_compression_enabled: true

# 2. Keep HTTP/3 enabled.
traefik_config_entrypoint_web_secure_http3_enabled: true

# Trust forwarding headers only from Cloudflare. This lets CrowdSec evaluate
# the original client IP without accepting spoofed X-Forwarded-For headers
# from direct connections to the origin.
matrix_cloudflare_proxy_trusted_ips:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
traefik_config_entrypoint_web_secure_forwardedHeaders_trustedIPs: "{{ matrix_cloudflare_proxy_trusted_ips }}"

# CrowdSec's Traefik plugin blocks LAPI decisions and sends requests through
# AppSec virtual patching. Failure modes are deliberately open so a CrowdSec
# restart cannot take Matrix offline.
traefik_plugin_support_enabled: true
traefik_configuration_extension_yaml: |
  experimental:
    abortOnPluginFailure: true
    plugins:
      bouncer:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.4.5
traefik_container_extra_arguments_custom:
  - "--add-host=host.docker.internal:host-gateway"
traefik_container_additional_volumes_custom:
  - type: bind
    src: /etc/crowdsec/bouncers/matrix-traefik.key
    dst: /etc/traefik/crowdsec/matrix-traefik.key
    options: ro
traefik_config_http_middlewares_custom:
  crowdsec:
    plugin:
      bouncer:
        enabled: true
        logLevel: INFO
        crowdsecMode: stream
        crowdsecLapiScheme: http
        crowdsecLapiHost: host.docker.internal:8080
        crowdsecLapiKeyFile: /etc/traefik/crowdsec/matrix-traefik.key
        updateIntervalSeconds: 60
        updateMaxFailure: -1
        streamStartupBlock: false
        crowdsecAppsecEnabled: true
        crowdsecAppsecScheme: http
        crowdsecAppsecHost: host.docker.internal:7422
        crowdsecAppsecFailureBlock: false
        crowdsecAppsecUnreachableBlock: false
        crowdsecAppsecBodyLimit: 1048576
        crowdsecAppsecUnreadableBodyBlock: false
        forwardedHeadersTrustedIPs: "{{ matrix_cloudflare_proxy_trusted_ips }}"
traefik_config_entrypoint_web_secure_http_middlewares_custom:
  - crowdsec@file
# Charm companion web-server API routing. Keep this in Traefik's managed
# provider config so the `/api` path does not depend on ad hoc VPS label edits.
# `charm.cloudhub.social` was reassigned back to Charm 1.0 (2026-07-09) — Charm
# 2.0's web build now lives on charm-2-dev.cloudhub.social instead.
traefik_provider_configuration_extension_yaml: |
  http:
    middlewares:
      matrix-charm-web-server-headers:
        headers:
          customResponseHeaders:
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
            X-Content-Type-Options: "nosniff"
      matrix-charm-web-server-no-cache:
        headers:
          customResponseHeaders:
            Cache-Control: "no-store"
    routers:
      matrix-charm-web-server-api:
        rule: "Host(`charm-2-dev.cloudhub.social`) && PathPrefix(`/api`)"
        service: matrix-charm-web-server
        entryPoints: web-secure
        middlewares:
          - compression
          - matrix-charm-web-server-no-cache
          - matrix-charm-web-server-headers
        priority: 200
        tls:
          certResolver: default
      matrix-charm-web-server-direct:
        rule: "Host(`matrix-cloudhub-1.cloudhub.social`) && PathPrefix(`/api`)"
        service: matrix-charm-web-server
        entryPoints: web-secure
        middlewares:
          - compression
          - matrix-charm-web-server-no-cache
          - matrix-charm-web-server-headers
        priority: 200
        tls:
          certResolver: default
    services:
      matrix-charm-web-server:
        loadBalancer:
          servers:
            - url: "http://matrix-charm-web-server:8787"

