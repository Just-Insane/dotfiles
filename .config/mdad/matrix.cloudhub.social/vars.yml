# Discord (Mautrix - Puppet)
# Using CloudHub-Social fork: https://github.com/CloudHub-Social/discord
matrix_mautrix_discord_enabled: true
matrix_mautrix_discord_container_image: "ghcr.io/cloudhub-social/discord:main"
matrix_mautrix_discord_configuration_extension_yaml: |
  logging:
    min_level: debug
  bridge:
    sync_direct_chat_list: true
    # Presence/status syncing. All four are OFF for now: forwarding presence
    # to Discord (opcode 3) and subscribing to receive Discord presence (opcode 14)
    # are self-bot behaviors that can get a user token flagged (close code 4004).
    # "presence" = online/idle/dnd state; "status" = custom status text.
    sync_matrix_presence_to_discord: true
    sync_matrix_status_to_discord: true
    sync_discord_presence_to_matrix: true
    sync_discord_status_to_matrix: true
    # On-demand subscription settings (only apply when sync_discord_presence_to_matrix
    # is enabled; inert while it is false). false = subscribe guilds on demand.
    discord_presence_subscribe_all: false
    discord_presence_active_limit: 10
    encryption:
      self_sign: true
    backfill:
        # Limits for forward backfilling.
        forward_limits:
            # Initial backfill (when creating portal). 0 means backfill is disabled.
            # A special unlimited value is not supported, you must set a limit. Initial backfill will
            # fetch all messages first before backfilling anything, so high limits can take a lot of time.
            initial:
                dm: 100
                channel: 100
                thread: 100
            # Missed message backfill (on startup).
            # 0 means backfill is disabled, -1 means fetch all messages since last bridged message.
            # When using unlimited backfill (-1), messages are backfilled as they are fetched.
            # With limits, all messages up to the limit are fetched first and backfilled afterwards.
            missed:
                dm: -1
                channel: -1
                thread: -1
        # Maximum members in a guild to enable backfilling. Set to -1 to disable limit.
        # This can be used as a rough heuristic to disable backfilling in channels that are too active.
        # Currently only applies to missed message backfill.
        max_guild_members: -1

