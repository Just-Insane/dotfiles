# ## Sygnal (Sable Push Notifications)
matrix_sygnal_enabled: true
matrix_sygnal_hostname: sygnal.cloudhub.social
matrix_sygnal_configuration_extension_yaml: |
  metrics:
    sentry:
      enabled: true
      dsn: "https://c3f1f93bf3d8868347d2cfa84f44a1ed@o4511094843244544.ingest.de.sentry.io/4511094868738128"
